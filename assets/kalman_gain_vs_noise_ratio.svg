<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif">
<title>Steady-state Kalman gain as a function of the process-to-measurement noise ratio</title>
<desc>Two curves over a logarithmic axis of lambda, the ratio of process noise to measurement noise. The teal curve is the steady-state Kalman gain, rising from near zero at small lambda toward one at large lambda. The amber curve is the equivalent exponential-moving-average span, falling from roughly a thousand bars at small lambda to a couple of bars at large lambda. No operating point is marked.</desc>
<rect x="0" y="0" width="680" height="380" fill="#0A0F14"/>
<text x="62" y="18" font-size="12" font-weight="bold" fill="#E6EEF7">Steady-state gain is set by the noise ratio, not chosen by hand</text>
<text x="62" y="30" font-size="9" fill="#5B6B7A">K&#8734; solves K&#178; + &#955;K &#8722; &#955; = 0 &#160;where&#160; &#955; = Q / R &#160;&#183;&#160; equivalent EMA span N = 2/K &#8722; 1</text>

